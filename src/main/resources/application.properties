spring.application.name=bustracking2026

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

spring.datasource.hikari.maximum-pool-size=5
# Fail after 5s instead of the default 30s when the pool is exhausted, so requests do not pile up on Tomcat threads
spring.datasource.hikari.connection-timeout=5000
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.bustracking.bustrack.model
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.bustracking.bustrack.typehandlers

server.port=8080


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.client-type=lettuce

management.endpoints.web.exposure.include=health,info,prometheus

management.endpoint.health.show-details=never

management.metrics.tags.application=bus-tracking
