worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server_tokens off;

    client_max_body_size 100M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    resolver 127.0.0.11 ipv6=off valid=30s;

    upstream backend {
        server bus-backend:8080;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # SECURITY HEADERS
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # ALLOW GEOLOCATION, BLOCK OTHERS
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# 1. USER FRONTEND (Root)
# location / {
#     limit_req zone=static_limit burst=50 nodelay;
#     root /usr/share/nginx/html/user;
#     index index.html;
#     try_files $uri $uri/ /index.html;
# }

# 2. ADMIN FRONTEND (/admin/)
# location /admin/ {
#     limit_req zone=static_limit burst=50 nodelay;
#     alias /usr/share/nginx/html/admin/;
#     index index.html;
#     try_files $uri $uri/ /admin/index.html;
# }


        # 3. STATIC ASSETS (Long Cache)
        location ~* \.(css|js|png|jpg|svg|ico|woff2)$ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # BLOCK SWAGGER IN PROD
        location ~* ^/api/(swagger-ui.*|v3/api-docs.*|actuator/.*) {
            return 403;
        }
        # 4. API PROXY
        location / {
            limit_req zone=api_limit burst=100 nodelay;



            proxy_pass http://backend;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Clear connection header for keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            # METHOD WHITELIST
            limit_except GET POST PUT DELETE OPTIONS {
                deny all;
            }
        }







    }
}